<svg xmlns="http://www.w3.org/2000/svg"
     width="1100" height="960" viewBox="0 0 1100 960">

  <rect width="1100" height="960" fill="white"/>

  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 19px;
      fill: #172033;
      text-anchor: middle;
    }
    .titulo {
      font-size: 27px;
      font-weight: bold;
    }
    .bloque {
      fill: white;
      stroke: #334155;
      stroke-width: 2;
    }
    .evaluacion {
      fill: #e8f1fa;
      stroke: #334155;
      stroke-width: 2;
    }
  </style>

  <text x="550" y="42" class="titulo">paso_rk4</text>
  <text x="550" y="73">Diagrama Nassi-Schneiderman</text>

  <rect x="30" y="100" width="1040" height="70" class="bloque"/>
  <text x="550" y="143">Recibir x, v, masa, beta y paso temporal h</text>

  <rect x="30" y="170" width="1040" height="70" class="evaluacion"/>
  <text x="550" y="213">
    (k1x, k1v) ← calcular_derivadas(v, masa, beta)
  </text>

  <rect x="30" y="240" width="1040" height="70" class="bloque"/>
  <text x="550" y="283">v2 ← v + (h / 2) × k1v</text>

  <rect x="30" y="310" width="1040" height="70" class="evaluacion"/>
  <text x="550" y="353">
    (k2x, k2v) ← calcular_derivadas(v2, masa, beta)
  </text>

  <rect x="30" y="380" width="1040" height="70" class="bloque"/>
  <text x="550" y="423">v3 ← v + (h / 2) × k2v</text>

  <rect x="30" y="450" width="1040" height="70" class="evaluacion"/>
  <text x="550" y="493">
    (k3x, k3v) ← calcular_derivadas(v3, masa, beta)
  </text>

  <rect x="30" y="520" width="1040" height="70" class="bloque"/>
  <text x="550" y="563">v4 ← v + h × k3v</text>

  <rect x="30" y="590" width="1040" height="70" class="evaluacion"/>
  <text x="550" y="633">
    (k4x, k4v) ← calcular_derivadas(v4, masa, beta)
  </text>

  <rect x="30" y="660" width="1040" height="90" class="bloque"/>
  <text x="550" y="712">
    x_nuevo ← x + (h / 6) × (k1x + 2 × k2x + 2 × k3x + k4x)
  </text>

  <rect x="30" y="750" width="1040" height="90" class="bloque"/>
  <text x="550" y="802">
    v_nuevo ← v + (h / 6) × (k1v + 2 × k2v + 2 × k3v + k4v)
  </text>

  <rect x="30" y="840" width="1040" height="80" class="bloque"/>
  <text x="550" y="887">Devolver (x_nuevo, v_nuevo)</text>

</svg>